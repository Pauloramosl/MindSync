<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definição de Gradientes e Efeitos -->
  <defs>
    <!-- Gradiente de fundo do ícone -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1026" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>

    <!-- Gradiente do Circuito Cerebral (Ciano para Azul) -->
    <linearGradient id="brain-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Glow/Brilho neon para o circuito -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados premium -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Brilho radial de fundo sutil atrás do cérebro -->
  <circle cx="256" cy="256" r="160" fill="#00D2FF" opacity="0.09" filter="blur(40px)" />

  <!-- Desenho do BrainCircuit centralizado -->
  <g transform="translate(74, 64) scale(15)" stroke="url(#brain-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neon-glow)">
    <!-- Silhueta esquerda do cérebro -->
    <path d="M12 4.5a2.5 2.5 0 0 0-4.96-.46 2.5 2.5 0 0 0-1.98 3 2.5 2.5 0 0 0-1.32 4.24 3 3 0 0 0 .34 4A2.5 2.5 0 0 0 6 18c0 .53.16 1 .46 1.4A2.5 2.5 0 0 0 12 18" />
    
    <!-- Linha divisória vertical -->
    <path d="M12 4.5V18" />
    
    <!-- Conexão 1 -->
    <path d="M12 5h4a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1h-4" />
    
    <!-- Conexão 2 -->
    <path d="M12 12h4a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1h-4" />
    
    <!-- Conexão 3 (Circuito com curva) -->
    <path d="M12 8.5h7a1 1 0 0 0 1-1V5" />
    
    <!-- Nós/Círculos do circuito preenchidos para efeito tecnológico -->
    <circle cx="16" cy="8" r="0.9" fill="url(#brain-grad)" stroke="none" />
    <circle cx="16" cy="15" r="0.9" fill="url(#brain-grad)" stroke="none" />
    <circle cx="19" cy="4" r="0.9" fill="url(#brain-grad)" stroke="none" />
  </g>
</svg>